<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juliet Sabol</title>
  <meta name="description" content="Juliet Sabol — GitHub and LinkedIn.">
  <link rel="canonical" href="https://julietsabol.com/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231c1c1e'/><text x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23fff' text-anchor='middle'>JS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f3;
      --fg: #1c1c1e;
      --muted: #6b6b70;
      --line: #dcdad4;
      --btn-hover: #ecebe6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --fg: #f2f1ee;
        --muted: #9a9aa0;
        --line: #2e2e33;
        --btn-hover: #222226;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { text-align: center; }
    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.75rem, 9vw, 5rem);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .rule {
      width: 48px;
      height: 1px;
      margin: 28px auto;
      background: var(--line);
    }
    nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    nav a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color .15s ease, border-color .15s ease;
    }
    nav a:hover { background: var(--btn-hover); border-color: var(--muted); }
    nav a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    nav svg { width: 18px; height: 18px; fill: currentColor; }
    .projects {
      width: min(440px, 100%);
      margin: 56px auto 0;
      text-align: left;
    }
    .projects h2 {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }
    .projects ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .projects li { border-bottom: 1px solid var(--line); }
    .projects a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 4px;
      color: var(--fg);
      text-decoration: none;
    }
    .projects a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .project-title { display: block; font-weight: 500; }
    .project-desc { display: block; margin-top: 3px; color: var(--muted); font-size: 0.875rem; line-height: 1.4; }
    .projects .arrow { flex: none; color: var(--muted); transition: transform .15s ease, color .15s ease; }
    .projects a:hover .arrow { color: var(--fg); transform: translate(2px, -2px); }
    .projects a:hover .project-title { text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Juliet Sabol</h1>
    <div class="rule" aria-hidden="true"></div>
    <nav>
      <a href="https://github.com/jsabol" rel="me noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.39-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/jasabol" rel="me noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
        LinkedIn
      </a>
    </nav>
    <section class="projects" aria-labelledby="projects-heading">
      <h2 id="projects-heading">Projects</h2>
      <ul>
        <li>
          <a href="https://tabletop.julietsabol.com">
            <span>
              <span class="project-title">Tabletop Campaign Manager</span>
              <span class="project-desc">Invite-only site for my personal TTRPG campaigns</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a href="https://jsabol.github.io/chronicles-of-orin-funnel/">
            <span>
              <span class="project-title">The Chronicles of Orin Funnel</span>
              <span class="project-desc">A character randomizer for a level-zero funnel adventure</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a href="https://theconstant.tasktree.games">
            <span>
              <span class="project-title">The Constant Task Tree</span>
              <span class="project-desc">Game completionist checklist for Don't Starve Together</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
